spring.application.name=SonidoVivo_BackEnd
server.port=8081

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:SonidoVivo_BackEnd/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonido_vivo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=30
app.jwt.issuer=sonido-vivo
app.jwt.refresh-expiration-days=7